<?xml version="1.0" encoding="UTF-8"?>
<!-- WiFi Analyzer — Channels view (800×480 landscape) -->
<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>text { font-family: 'Courier New', Courier, monospace; }</style>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#0D1117"/>

  <!-- Header bar -->
  <rect width="800" height="28" fill="#161B22"/>
  <text x="8" y="6" font-size="16" fill="#539BF5" dominant-baseline="hanging">WiFi Analyzer  8 networks  [Channels]</text>

  <!-- Footer bar -->
  <rect y="458" width="800" height="22" fill="#161B22"/>
  <text x="8" y="463" font-size="13" fill="#768390" dominant-baseline="hanging">F1/ESC=Exit  Tab=View  R=Rescan  H=Hidden(on/off)</text>

  <!-- ── Channel bars ──────────────────────────────────────────────────────── -->
  <!-- Layout: slot_w=60, bar_w=54, bar_x=x+3, lbl_y=440, content_h=412      -->
  <!-- bar_h = (rssi+95)*412/65, bar_y = 440-bar_h                            -->

  <!-- ch 1 · 2 APs · best −78 dBm · FAIR #DB6D28 · bar_h=107 -->
  <rect x="13" y="333" width="54" height="107" fill="#DB6D28"/>
  <text x="14" y="319" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">-78</text>
  <text x="15" y="335" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">2</text>

  <!-- ch 3 · 1 AP · best −84 dBm · POOR #E5534B · bar_h=70 -->
  <rect x="133" y="370" width="54" height="70" fill="#E5534B"/>
  <text x="134" y="356" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">-84</text>

  <!-- ch 6 · 3 APs (incl hidden) · best −52 dBm · GOOD #57AB5A · bar_h=273 -->
  <rect x="313" y="167" width="54" height="273" fill="#57AB5A"/>
  <text x="314" y="153" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">-52</text>
  <text x="315" y="169" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">3</text>

  <!-- ch 11 · 2 APs · best −65 dBm · OK #CFBA06 · bar_h=190 -->
  <rect x="613" y="250" width="54" height="190" fill="#CFBA06"/>
  <text x="614" y="236" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">-65</text>
  <text x="615" y="252" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">2</text>

  <!-- ── Channel axis labels (1–13) · text_x = 10+(ch-1)*60+25 ────────────── -->
  <text x="35"  y="440" font-size="13" fill="#768390" dominant-baseline="hanging">1</text>
  <text x="95"  y="440" font-size="13" fill="#768390" dominant-baseline="hanging">2</text>
  <text x="155" y="440" font-size="13" fill="#768390" dominant-baseline="hanging">3</text>
  <text x="215" y="440" font-size="13" fill="#768390" dominant-baseline="hanging">4</text>
  <text x="275" y="440" font-size="13" fill="#768390" dominant-baseline="hanging">5</text>
  <text x="335" y="440" font-size="13" fill="#768390" dominant-baseline="hanging">6</text>
  <text x="395" y="440" font-size="13" fill="#768390" dominant-baseline="hanging">7</text>
  <text x="455" y="440" font-size="13" fill="#768390" dominant-baseline="hanging">8</text>
  <text x="515" y="440" font-size="13" fill="#768390" dominant-baseline="hanging">9</text>
  <text x="568" y="440" font-size="13" fill="#768390" dominant-baseline="hanging">10</text>
  <text x="628" y="440" font-size="13" fill="#768390" dominant-baseline="hanging">11</text>
  <text x="688" y="440" font-size="13" fill="#768390" dominant-baseline="hanging">12</text>
  <text x="748" y="440" font-size="13" fill="#768390" dominant-baseline="hanging">13</text>
</svg>
