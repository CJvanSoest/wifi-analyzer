<?xml version="1.0" encoding="UTF-8"?>
<!-- WiFi Analyzer — Graph view (800×480 landscape)                           -->
<!-- Gaussian arch lines: Q cx,peak R,base quadratic bezier approximation     -->
<!-- ellipse_bottom=412, content_h=384, legend 2 rows (28px), ch-labels y=440 -->
<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>text { font-family: 'Courier New', Courier, monospace; }</style>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#0D1117"/>

  <!-- Header bar -->
  <rect width="800" height="28" fill="#161B22"/>
  <text x="8" y="6" font-size="16" fill="#539BF5" dominant-baseline="hanging">WiFi Analyzer  8 networks  [Graph]</text>

  <!-- Footer bar -->
  <rect y="458" width="800" height="22" fill="#161B22"/>
  <text x="8" y="463" font-size="13" fill="#768390" dominant-baseline="hanging">F1/ESC=Exit  Tab=View  R=Rescan  H=Hidden</text>

  <!-- ── Channel axis · baseline y=412, tick y=408→412, labels y=440 ───────── -->
  <line x1="30" y1="412" x2="770" y2="412" stroke="#768390" stroke-width="1"/>
  <!-- Tick marks at x_margin+(ch-1)*62 -->
  <line x1="30"  y1="408" x2="30"  y2="412" stroke="#768390"/>
  <line x1="92"  y1="408" x2="92"  y2="412" stroke="#768390"/>
  <line x1="154" y1="408" x2="154" y2="412" stroke="#768390"/>
  <line x1="216" y1="408" x2="216" y2="412" stroke="#768390"/>
  <line x1="278" y1="408" x2="278" y2="412" stroke="#768390"/>
  <line x1="340" y1="408" x2="340" y2="412" stroke="#768390"/>
  <line x1="402" y1="408" x2="402" y2="412" stroke="#768390"/>
  <line x1="464" y1="408" x2="464" y2="412" stroke="#768390"/>
  <line x1="526" y1="408" x2="526" y2="412" stroke="#768390"/>
  <line x1="588" y1="408" x2="588" y2="412" stroke="#768390"/>
  <line x1="650" y1="408" x2="650" y2="412" stroke="#768390"/>
  <line x1="712" y1="408" x2="712" y2="412" stroke="#768390"/>
  <line x1="774" y1="408" x2="774" y2="412" stroke="#768390"/>
  <!-- Channel labels at lbl_y=440 (tick_x - 5) -->
  <text x="25"  y="440" font-size="12" fill="#768390" dominant-baseline="hanging">1</text>
  <text x="87"  y="440" font-size="12" fill="#768390" dominant-baseline="hanging">2</text>
  <text x="149" y="440" font-size="12" fill="#768390" dominant-baseline="hanging">3</text>
  <text x="211" y="440" font-size="12" fill="#768390" dominant-baseline="hanging">4</text>
  <text x="273" y="440" font-size="12" fill="#768390" dominant-baseline="hanging">5</text>
  <text x="335" y="440" font-size="12" fill="#768390" dominant-baseline="hanging">6</text>
  <text x="397" y="440" font-size="12" fill="#768390" dominant-baseline="hanging">7</text>
  <text x="459" y="440" font-size="12" fill="#768390" dominant-baseline="hanging">8</text>
  <text x="521" y="440" font-size="12" fill="#768390" dominant-baseline="hanging">9</text>
  <text x="577" y="440" font-size="12" fill="#768390" dominant-baseline="hanging">10</text>
  <text x="640" y="440" font-size="12" fill="#768390" dominant-baseline="hanging">11</text>
  <text x="702" y="440" font-size="12" fill="#768390" dominant-baseline="hanging">12</text>
  <text x="764" y="440" font-size="12" fill="#768390" dominant-baseline="hanging">13</text>

  <!-- ── Arch curves · drawn weakest-first (back to front) ─────────────────── -->
  <!-- Path form: M L,412 Q cx,peak R,412 for arches with both sides visible   -->
  <!--            M L,412 Q cx,peak R,412 clipped at left margin for ch1 nets  -->

  <!-- Ziggo-123456 #FFA657 · ch3 · −84dBm · 40MHz · peak_h=60 · peak_y=352  -->
  <!-- cx=154, sigma=124px, L≈30(clamped), R=526 -->
  <path d="M 30,412 Q 154,352 526,412 Z" fill="#FFA657" fill-opacity="0.18"/>
  <path d="M 30,412 Q 154,352 526,412" fill="none" stroke="#FFA657" stroke-width="2"/>

  <!-- FRITZ!Box 7490 #6CB6FF · ch1 · −82dBm · 40MHz · peak_h=71 · peak_y=341 -->
  <!-- cx=30(clamped), L=30, R=402 — right-opening half arch -->
  <path d="M 30,412 L 30,341 Q 30,412 402,412 Z" fill="#6CB6FF" fill-opacity="0.18"/>
  <path d="M 30,341 Q 30,412 402,412" fill="none" stroke="#6CB6FF" stroke-width="2"/>

  <!-- KPN_Hotspot #CFBA06 · ch1 · −78dBm · 20MHz · peak_h=93 · peak_y=319  -->
  <!-- cx=30(clamped), L=30, R=216 — right-opening half arch -->
  <path d="M 30,412 L 30,319 Q 30,412 216,412 Z" fill="#CFBA06" fill-opacity="0.18"/>
  <path d="M 30,319 Q 30,412 216,412" fill="none" stroke="#CFBA06" stroke-width="2"/>

  <!-- Buren_2.4G #E5534B · ch6 · −71dBm · 20MHz · peak_h=132 · peak_y=280  -->
  <!-- cx=340, sigma=62px, L=154, R=526 -->
  <path d="M 154,412 Q 340,280 526,412 Z" fill="#E5534B" fill-opacity="0.18"/>
  <path d="M 154,412 Q 340,280 526,412" fill="none" stroke="#E5534B" stroke-width="2"/>

  <!-- Telenet-3F8A #DB6D28 · ch11 · −68dBm · 20MHz · peak_h=148 · peak_y=264 -->
  <!-- cx=650, sigma=62px, L=464, R=770(clamped) -->
  <path d="M 464,412 Q 650,264 770,412 Z" fill="#DB6D28" fill-opacity="0.18"/>
  <path d="M 464,412 Q 650,264 770,412" fill="none" stroke="#DB6D28" stroke-width="2"/>

  <!-- AndroidAP_5E2A #57AB5A · ch11 · −65dBm · 20MHz · peak_h=165 · peak_y=247 -->
  <!-- cx=650, sigma=62px, L=464, R=770(clamped) -->
  <path d="M 464,412 Q 650,247 770,412 Z" fill="#57AB5A" fill-opacity="0.18"/>
  <path d="M 464,412 Q 650,247 770,412" fill="none" stroke="#57AB5A" stroke-width="2"/>

  <!-- HomeNetwork #539BF5 · ch6 · −52dBm · 40MHz · peak_h=236 · peak_y=176  -->
  <!-- cx=340, sigma=124px, L=30(clamped), R=712 -->
  <path d="M 30,412 Q 340,176 712,412 Z" fill="#539BF5" fill-opacity="0.18"/>
  <path d="M 30,412 Q 340,176 712,412" fill="none" stroke="#539BF5" stroke-width="2"/>

  <!-- ── SSID labels at dome peaks (dark bg + colored text) ────────────────── -->
  <!-- format: "N:SSID8ch BW" · font-size=12 · bg=0xCC0D1117 (80% dark) -->

  <!-- HomeNetwork at peak_px=340, lbl_y=160 -->
  <rect x="338" y="159" width="108" height="14" fill="#0D1117" fill-opacity="0.82"/>
  <text x="340" y="160" font-size="12" fill="#539BF5" dominant-baseline="hanging">1:HomeNetw 40M</text>

  <!-- Buren_2.4G at peak_px=340, lbl_y=264 -->
  <rect x="338" y="263" width="108" height="14" fill="#0D1117" fill-opacity="0.82"/>
  <text x="340" y="264" font-size="12" fill="#E5534B" dominant-baseline="hanging">4:Buren_2. 20M</text>

  <!-- AndroidAP at peak_px=650, lbl_y=231 -->
  <rect x="648" y="230" width="108" height="14" fill="#0D1117" fill-opacity="0.82"/>
  <text x="650" y="231" font-size="12" fill="#57AB5A" dominant-baseline="hanging">2:AndroidA 20M</text>

  <!-- Telenet at peak_px=650, lbl_y=248 -->
  <rect x="648" y="247" width="108" height="14" fill="#0D1117" fill-opacity="0.82"/>
  <text x="650" y="248" font-size="12" fill="#DB6D28" dominant-baseline="hanging">3:Telenet- 20M</text>

  <!-- KPN at peak_px=30, lbl_y=303 -->
  <rect x="28" y="302" width="108" height="14" fill="#0D1117" fill-opacity="0.82"/>
  <text x="30" y="303" font-size="12" fill="#CFBA06" dominant-baseline="hanging">5:KPN_Hots 20M</text>

  <!-- FRITZ at peak_px=30, lbl_y=325 -->
  <rect x="28" y="324" width="108" height="14" fill="#0D1117" fill-opacity="0.82"/>
  <text x="30" y="325" font-size="12" fill="#6CB6FF" dominant-baseline="hanging">6:FRITZ!Bo 40M</text>

  <!-- Ziggo at peak_px=154, lbl_y=352 -->
  <rect x="152" y="351" width="108" height="14" fill="#0D1117" fill-opacity="0.82"/>
  <text x="154" y="352" font-size="12" fill="#FFA657" dominant-baseline="hanging">7:Ziggo-12 40M</text>

  <!-- ── Legend strip · 7 APs · 4 per row · entry_w=185 · y=414,427 ────────── -->
  <!-- Row 0 -->
  <!-- [0] HomeNetwork 40M · col=30 -->
  <rect x="30" y="415" width="10" height="10" fill="#539BF5"/>
  <text x="43" y="414" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">HomeNetw 40M</text>
  <!-- [1] AndroidAP 20M · col=215 -->
  <rect x="215" y="415" width="10" height="10" fill="#57AB5A"/>
  <text x="228" y="414" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">AndroidA 20M</text>
  <!-- [2] Telenet 20M · col=400 -->
  <rect x="400" y="415" width="10" height="10" fill="#DB6D28"/>
  <text x="413" y="414" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">Telenet- 20M</text>
  <!-- [3] Buren 20M · col=585 -->
  <rect x="585" y="415" width="10" height="10" fill="#E5534B"/>
  <text x="598" y="414" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">Buren_2. 20M</text>
  <!-- Row 1 -->
  <!-- [4] KPN 20M · col=30 -->
  <rect x="30" y="428" width="10" height="10" fill="#CFBA06"/>
  <text x="43" y="427" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">KPN_Hots 20M</text>
  <!-- [5] FRITZ 40M · col=215 -->
  <rect x="215" y="428" width="10" height="10" fill="#6CB6FF"/>
  <text x="228" y="427" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">FRITZ!Bo 40M</text>
  <!-- [6] Ziggo 40M · col=400 -->
  <rect x="400" y="428" width="10" height="10" fill="#FFA657"/>
  <text x="413" y="427" font-size="11" fill="#CDD9E5" dominant-baseline="hanging">Ziggo-12 40M</text>
</svg>
